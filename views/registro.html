<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Registrar</title>
  <style>
    .erro { color: red; font-size: 0.9rem; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>Registrar</h1>
  <form id="formRegistro">
    <label>Nome:</label><br>
    <input type="text" name="nome" id="nome"><br>
    <div class="erro" id="erro-nome"></div>

    <label>Email:</label><br>
    <input type="email" name="email" id="email"><br>
    <div class="erro" id="erro-email"></div>

    <label>Senha:</label><br>
    <input type="password" name="senha" id="senha"><br>
    <small>Senha com 8+ caracteres, letra maiúscula/minúscula, número e símbolo.</small><br>
    <div class="erro" id="erro-senha"></div>

    <br>
    <button type="submit">Registrar</button>
  </form>

  <script>
    document.getElementById('formRegistro').addEventListener('submit', async (e) => {
      e.preventDefault();

      // Limpa os erros
      ['nome', 'email', 'senha'].forEach(id => {
        document.getElementById('erro-' + id).innerText = '';
      });

      const nome = document.getElementById('nome').value;
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;

      try {
        const res = await fetch('/auth/registrar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, email, senha })
        });

        const data = await res.json();

        if (!res.ok && data.erros) {
          Object.entries(data.erros).forEach(([campo, msg]) => {
            document.getElementById(`erro-${campo}`).innerText = msg;
          });
        } else if (res.ok) {
          window.location.href = data.redirecionar;
        }

      } catch (err) {
        alert('Erro de rede');
        console.error(err);
      }
    });
  </script>
</body>
</html>
