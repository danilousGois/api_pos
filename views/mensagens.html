<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Mensagens</title>
  <style>
    .erro { color: red; }
    .mensagem { border: 1px solid #ccc; padding: 10px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>Mensagens</h1>

  <form id="formMensagem">
    <textarea id="conteudo" placeholder="Escreva sua mensagem" required></textarea><br>
    <button type="submit">Enviar</button>
    <div id="erro-msg" class="erro"></div>
  </form>

  <hr>

  <div id="lista-mensagens"></div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      alert('Você precisa estar logado.');
      window.location.href = '/login';
    }

    const headers = { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` };

    async function carregarMensagens() {
      const res = await fetch('/mensagens', { headers });
      const data = await res.json();
      const lista = document.getElementById('lista-mensagens');
      lista.innerHTML = '';

      if (Array.isArray(data)) {
        data.forEach(msg => {
          const div = document.createElement('div');
          div.className = 'mensagem';
          div.innerHTML = `
            <p>${msg.conteudo}</p>
            <small>${new Date(msg.dataHora).toLocaleString()}</small><br>
            <button onclick="editar(${msg.id_mensagem}, '${msg.conteudo.replace(/'/g, "\\'")}')">Editar</button>
            <button onclick="excluir(${msg.id_mensagem})">Excluir</button>
          `;
          lista.appendChild(div);
        });
      }
    }

    document.getElementById('formMensagem').addEventListener('submit', async (e) => {
      e.preventDefault();
      const conteudo = document.getElementById('conteudo').value;
      const erroMsg = document.getElementById('erro-msg');
      erroMsg.textContent = '';

      const res = await fetch('/mensagens', {
        method: 'POST',
        headers,
        body: JSON.stringify({ conteudo })
      });

      if (res.ok) {
        document.getElementById('conteudo').value = '';
        carregarMensagens();
      } else {
        const data = await res.json();
        erroMsg.textContent = data.erro || 'Erro ao enviar mensagem';
      }
    });

    async function excluir(id) {
      await fetch(`/mensagens/${id}`, {
        method: 'DELETE',
        headers
      });
      carregarMensagens();
    }

    async function editar(id, antigoConteudo) {
      const novo = prompt('Novo conteúdo:', antigoConteudo);
      if (novo && novo.trim()) {
        await fetch(`/mensagens/${id}`, {
          method: 'PUT',
          headers,
          body: JSON.stringify({ conteudo: novo })
        });
        carregarMensagens();
      }
    }

    carregarMensagens();
  </script>
</body>
</html>
