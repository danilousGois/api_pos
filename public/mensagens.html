<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Mensagens</title>
</head>
<body>
  <h2>Mensagens</h2>

  <form id="mensagemForm">
    <input type="text" name="conteudo" placeholder="Digite uma mensagem" required>
    <button type="submit">Enviar</button>
  </form>

  <button onclick="carregarMensagens()">Atualizar Lista</button>
  <ul id="listaMensagens"></ul>

  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      alert('Você precisa estar logado!');
      window.location.href = 'login.html';
    }

    document.getElementById('mensagemForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const res = await fetch('/mensagens', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ conteudo: form.conteudo.value })
      });
      const data = await res.json();
      form.reset();
      carregarMensagens();
    });

    async function carregarMensagens() {
      const res = await fetch('/mensagens', {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const mensagens = await res.json();
      const ul = document.getElementById('listaMensagens');
      ul.innerHTML = '';

      mensagens.forEach(msg => {
        const li = document.createElement('li');
        li.innerHTML = `
          <strong>${msg.usuario?.nome || 'Anônimo'}:</strong> 
          ${msg.conteudo}
          <button onclick="removerMensagem(${msg.id})">X</button>
        `;
        ul.appendChild(li);
      });
    }

    async function removerMensagem(id) {
      if (confirm('Remover esta mensagem?')) {
        await fetch(`/mensagens/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        carregarMensagens();
      }
    }

    carregarMensagens();
  </script>
</body>
</html>
