<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; }
    form { max-width: 400px; }
    label { display: block; margin-top: 1rem; }
    input { width: 100%; padding: 0.5rem; margin-top: 0.2rem; }
    button { margin-top: 1rem; padding: 0.6rem; width: 100%; }
    #mensagemErro { color: red; margin-top: 1rem; }
  </style>
</head>
<body>

  <h1>Login</h1>
  <form id="formLogin">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required />

    <label for="senha">Senha</label>
    <input type="password" id="senha" name="senha" required />

    <button type="submit">Entrar</button>
  </form>

  <div id="mensagemErro"></div>

  <script>
    const form = document.getElementById('formLogin');
    const mensagemErro = document.getElementById('mensagemErro');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      mensagemErro.textContent = '';

      const email = form.email.value.trim();
      const senha = form.senha.value.trim();

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });

        if (!res.ok) {
          const data = await res.json();
          mensagemErro.textContent = data.erro || 'Erro desconhecido';
          return;
        }

        const data = await res.json();
        localStorage.setItem('token', data.token);

        // Redireciona para página de mensagens
        window.location.href = '/mensagens';

      } catch (error) {
        mensagemErro.textContent = 'Erro na requisição. Tente novamente.';
      }
    });
  </script>

</body>
</html>
