<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Registro</title>
  <style>
    .erro {
      color: red;
      font-size: 0.9rem;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h1>Registrar</h1>
  <form id="formRegistro">
    <label for="nome">Nome:</label><br>
    <input type="text" id="nome" name="nome"><br>
    <div id="erro-nome" class="erro"></div>

    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email"><br>
    <div id="erro-email" class="erro"></div>

    <label for="senha">Senha:</label><br>
    <input type="password" id="senha" name="senha"><br>
    <small style="color:#555">Mínimo 8 caracteres, com maiúscula, minúscula, número e símbolo</small><br>
    <div id="erro-senha" class="erro"></div>

    <br><button type="submit">Registrar</button>
  </form>

  <script>
    const form = document.getElementById('formRegistro');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Limpa mensagens antigas
      document.getElementById('erro-nome').innerText = '';
      document.getElementById('erro-email').innerText = '';
      document.getElementById('erro-senha').innerText = '';

      const nome = document.getElementById('nome').value;
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;

      try {
        const resposta = await fetch('/auth/registrar', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ nome, email, senha })
        });

        const dados = await resposta.json();

        if (!resposta.ok) {
          // Mostra os erros abaixo dos campos
          if (dados.erros) {
            if (dados.erros.nome) {
              document.getElementById('erro-nome').innerText = dados.erros.nome;
            }
            if (dados.erros.email) {
              document.getElementById('erro-email').innerText = dados.erros.email;
            }
            if (dados.erros.senha) {
              document.getElementById('erro-senha').innerText = dados.erros.senha;
            }
          }
        } else {
          alert(dados.mensagem);
          form.reset();
        }

      } catch (err) {
        console.error('Erro ao registrar:', err);
      }
    });
  </script>
</body>
</html>
