<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    .erro { color: red; font-size: 0.9rem; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>Login</h1>
  <form id="formLogin">
    <label>Email:</label><br>
    <input type="email" name="email" id="email"><br>
    <div class="erro" id="erro-email"></div>

    <label>Senha:</label><br>
    <input type="password" name="senha" id="senha"><br>
    <div class="erro" id="erro-senha"></div>

    <br>
    <button type="submit">Entrar</button>
  </form>

  <script>
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();

      document.getElementById('erro-email').innerText = '';
      document.getElementById('erro-senha').innerText = '';

      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });

        const data = await res.json();

        if (!res.ok) {
          const erro = data.erro || 'Erro ao fazer login';
          if (erro.toLowerCase().includes('usuário')) {
            document.getElementById('erro-email').innerText = erro;
          } else {
            document.getElementById('erro-senha').innerText = erro;
          }
        } else {
          localStorage.setItem('token', data.token);
          window.location.href = data.redirecionar;
        }

      } catch (err) {
        alert('Erro de rede');
        console.error(err);
      }
    });
  </script>
</body>
</html>
